name: Build and Type-Check Application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-check: # More accurate name for the job
    runs-on: ubuntu-latest

    steps:
      # 1. Get your code from the repo
      - name: Checkout repository code
        uses: actions/checkout@v4

      # 2. Set up the Node.js environment
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18' # Matches your stack
          cache: 'npm' # This speeds up future runs by caching dependencies

      # 3. Install your project's dependencies
      - name: Install dependencies
        run: npm ci # 'ci' is generally preferred in pipelines over 'install'

      # 4. Run TypeScript type checker (Your current 'test')
      - name: Run TypeScript type check
        run: npm run check

      # 5. Build the application for production
      - name: Build production application
        run: npm run build

      # The deployment step would go here, running only after all the above succeed.
      # - name: Deploy
      #   run: ...
